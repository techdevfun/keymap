[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keymap"
version = "0.1.0"
description = "Map where your API keys live — locally, read-only, without ever printing key material."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "techdevfun" }]

[project.scripts]
keymap = "keymap.cli:main"

[tool.setuptools.packages.find]
include = ["keymap*"]
